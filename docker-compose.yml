# Local services: Postgres only, published on the loopback interface. POSTGRES_PASSWORD (required)
# and POSTGRES_PORT (optional, default 5432) come from .env; DATABASE_URL must use the same values.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracera
      POSTGRES_DB: tracera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tracera-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracera -d tracera"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tracera-pg:
